[tool.ruff]

# description of all rules are available on https://docs.astral.sh/ruff/rules/
lint.select = ["D", "E", "F", "W", "C", "S", "I", "TCH", "SLOT", "RUF", "C90", "N", "YTT", "ASYNC", "TRIO"]

# we need to check 'mood' of all docstrings, this needs to be enabled explicitly
lint.extend-select = ["D401"]

lint.ignore = []
lint.pydocstyle.convention = "google"

target-version = "py312"
line-length = 100

[tool.mypy]
disable_error_code = ["union-attr", "return-value", "arg-type", "import-untyped"]
ignore_missing_imports = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "requires_model: tests that require the embeddings model files",
]

[tool.coverage.run]
source = ["src", "scripts"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project]
name = "aap-rag-content"
version = "0.1.0"
description = "RAG content for AAP chatbot"
authors = []
dependencies = [
    "chardet==5.2.0",
    "cryptography>=50.0.0,<51", # Transient dep pinned to handle CVE
    "faiss-cpu==1.12",
    "filelock>=4.2.1", # Transient dep bumped for CVE-2026-112940
    "fsspec>=2026.6.0", # CVE-2026-104851
    "ogx-client>=1.2.5,<2",
    "ogx>=1.2.5,<2",
    "ogx-api>=1.2.5,<2",
    "openai>=2,<3",
    "mcp>=1.28.1,<2",
    "pyjwt>=2.13.0",  # Transient dep pinned for CVE-2026-48526
    "python-dotenv>=1.2.2", # CVE-2026-28684
    "python-multipart==0.0.33", # CVE-2026-42561
    "requests==2.34.2",
    "sentence-transformers==5.7.0",
    # Stay on 2.1.5: 2.1.6 is not yet on the RHAI index, and installing it
    # from sdist would require a native (Cython) compiler toolchain.
    # 2.1.5 has no reported CVE.
    "sqlalchemy[asyncio]==2.1.8",
    "starlette>=1.3.1,<2",  # Bumped for CVE-2026-54283
    "torch",
    "types-requests",
    "urllib3==2.8.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {file = "LICENSE"}

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]
